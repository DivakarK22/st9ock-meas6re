<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Measure</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        max-width: 640px;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      h1 {
        margin-bottom: 0.25rem;
      }
      form {
        display: grid;
        gap: 0.75rem;
        margin: 1.5rem 0;
      }
      label {
        display: grid;
        gap: 0.25rem;
        font-weight: 600;
      }
      input {
        padding: 0.5rem;
        font-size: 1rem;
      }
      button {
        padding: 0.6rem 1rem;
        font-size: 1rem;
        cursor: pointer;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
      }
      th,
      td {
        border: 1px solid #8884;
        padding: 0.5rem;
        text-align: left;
      }
      .status {
        padding: 0.5rem;
        border-radius: 4px;
        background: #e8f5e9;
        color: #1b5e20;
      }
      .error {
        background: #ffebee;
        color: #b71c1c;
      }
    </style>
  </head>
  <body>
    <h1>Stock Measure</h1>
    <p>Measure the total value of a stock position.</p>

    <div id="status" class="status">Checking server…</div>

    <form id="measure-form">
      <label>
        Symbol
        <input name="symbol" placeholder="AAPL" required />
      </label>
      <label>
        Quantity
        <input name="quantity" type="number" min="1" step="1" placeholder="10" required />
      </label>
      <button type="submit">Measure position</button>
    </form>

    <h2>Measurements</h2>
    <table>
      <thead>
        <tr>
          <th>Symbol</th>
          <th>Qty</th>
          <th>Price</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody id="measurements-body"></tbody>
    </table>

    <script>
      const statusEl = document.getElementById('status');
      const tbody = document.getElementById('measurements-body');
      const form = document.getElementById('measure-form');

      async function loadHealth() {
        const res = await fetch('/api/health');
        const data = await res.json();
        statusEl.textContent = `Server healthy — ${data.service}`;
        statusEl.classList.remove('error');
      }

      async function loadMeasurements() {
        const res = await fetch('/api/measurements');
        const { measurements } = await res.json();
        tbody.innerHTML = measurements
          .map(
            (m) =>
              `<tr><td>${m.symbol}</td><td>${m.quantity}</td><td>$${m.pricePerShare}</td><td>$${m.totalValue}</td></tr>`
          )
          .join('');
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const symbol = form.symbol.value;
        const quantity = Number(form.quantity.value);
        const res = await fetch('/api/measure', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ symbol, quantity }),
        });
        if (!res.ok) {
          const err = await res.json();
          statusEl.textContent = err.error || 'Measurement failed';
          statusEl.classList.add('error');
          return;
        }
        form.reset();
        await loadMeasurements();
        statusEl.textContent = 'Measurement recorded';
        statusEl.classList.remove('error');
      });

      loadHealth().then(loadMeasurements).catch(() => {
        statusEl.textContent = 'Server unreachable';
        statusEl.classList.add('error');
      });
    </script>
  </body>
</html>
